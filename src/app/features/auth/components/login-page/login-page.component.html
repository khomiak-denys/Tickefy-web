<div class="login-container">
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Tickefy</h1>
    <p class="subtitle">Sign in to your account</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Login</span>
        <input formControlName="login" type="text" placeholder="Your login" />
        <app-form-error [control]="form.get('login')"></app-form-error>
      </label>

      <label>
        <span>Password</span>
        <input formControlName="password" type="password" placeholder="Enter your password" />
        <app-form-error [control]="form.get('password')"></app-form-error>
      </label>

      <button class="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <p class="foot">
      Don't have an account? <a class="link" routerLink="/auth/register">Sign up</a>
    </p>
  </div>
</div>
