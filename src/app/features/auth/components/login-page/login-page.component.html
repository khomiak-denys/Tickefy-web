<div class="login-container">
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Tickefy</h1>
    <p class="subtitle">Sign in to your account</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Login</label>
      <div class="input" [class.invalid]="submitted && form.get('login')?.invalid">
        <input formControlName="login" type="text" placeholder="Your login" />
      </div>
      <div class="error" *ngIf="submitted && form.get('login')?.invalid">Login is required</div>

      <label>Password</label>
      <div class="input" [class.invalid]="submitted && form.get('password')?.invalid">
        <input formControlName="password" type="password" placeholder="Enter your password" />
      </div>
      <div class="error" *ngIf="submitted && form.get('password')?.invalid">Password is required</div>

      <button class="primary" type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign In' }}</button>
      <div class="error" *ngIf="error">{{ error }}</div>
    </form>

    <p class="foot">Don't have an account? <a class="link" routerLink="/auth/register">Sign up</a></p>
  </div>
</div>
