<app-modal-shell
  [open]="open"
  [title]="actionName + ' Ticket'"
  (closed)="cancel()"
  [formGroup]="form"
>
  <label>
    <span>Provide reason</span>
    <textarea formControlName="reasonText" rows="4" placeholder="Enter here"></textarea>
    <app-form-error [control]="form.get('reasonText')"></app-form-error>
  </label>

  <div modal-footer>
    <button type="button" class="secondary" [disabled]="submitting" (click)="cancel()">
      Cancel
    </button>
    <button type="button" class="primary" [disabled]="submitting" (click)="submit()">
      {{ submitting ? 'Loading' : 'Ok' }}
    </button>
  </div>
</app-modal-shell>
