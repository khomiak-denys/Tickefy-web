@if (open) {
  <div class="modal-backdrop" (click)="cancel()"></div>
  <div class="modal">
    <header class="modal-head">
      <h3>{{ actionName }} Ticket</h3>
      <button class="close" (click)="cancel()">×</button>
    </header>
    <section class="modal-body">
      <label>
        <span>Provide reason</span>
        <textarea [(ngModel)]="reasonText" rows="4" placeholder="Enter here"></textarea>
      </label>
    </section>
    <footer class="modal-foot">
      <button class="secondary" [disabled]="submitting" (click)="cancel()">Cancel</button>
      <button class="primary" [disabled]="submitting" (click)="submit()">
        {{ submitting ? 'Loading' : 'Ok' }}
      </button>
    </footer>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
  </div>
}
