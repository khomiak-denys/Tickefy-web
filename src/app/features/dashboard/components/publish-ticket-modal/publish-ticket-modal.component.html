@if (open) {
  <div class="modal-backdrop" (click)="close()"></div>
  <div class="modal" [formGroup]="form">
    <header class="modal-head">
      <h3>Publish Draft Ticket</h3>
      <button class="close" (click)="close()" aria-label="Close">
        <lucide-icon name="x" size="18"></lucide-icon>
      </button>
    </header>
    <section class="modal-body">
      <label>
        <span>Title</span>
        <input
          type="text"
          formControlName="title"
          placeholder="Brief description of your request"
        />
        <app-form-error [control]="form.get('title')"></app-form-error>
      </label>

      <label>
        <span>Description</span>
        <textarea
          formControlName="description"
          rows="6"
          placeholder="Detailed description of what you need..."
        ></textarea>
      </label>

      <label>
        <span>Deadline</span>
        <input type="date" formControlName="deadline" placeholder="mm/dd/yyyy" />
        <app-form-error [control]="form.get('deadline')"></app-form-error>
      </label>
    </section>
    <footer class="modal-foot">
      <button type="button" class="secondary" [disabled]="submitting" (click)="close()">
        Cancel
      </button>
      <button type="button" class="primary" [disabled]="submitting" (click)="submit()">
        Publish Ticket
      </button>
    </footer>
  </div>
}
