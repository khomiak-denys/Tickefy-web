<app-modal-shell [open]="open" title="Create New Ticket" (closed)="close()">
  <label>
    <span>Title</span>
    <input type="text" [(ngModel)]="newTitle" placeholder="Brief description of your request" />
  </label>
  <label>
    <span>Description</span>
    <textarea
      [(ngModel)]="newDescription"
      rows="6"
      placeholder="Detailed description of what you need..."
    ></textarea>
  </label>
  <label>
    <span>Deadline</span>
    <input type="date" [(ngModel)]="newDeadline" placeholder="mm/dd/yyyy" />
  </label>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <div modal-footer style="display: flex; gap: 12px; width: 100%">
    <button class="secondary" [disabled]="createSubmitting" (click)="close()" style="flex: 1 1 0">
      Cancel
    </button>
    <app-split-button
      [options]="ticketSubmitOptions"
      [disabled]="createSubmitting"
      (actionExecuted)="submit($event)"
      style="flex: 1 1 0; display: block"
    >
    </app-split-button>
  </div>
</app-modal-shell>
