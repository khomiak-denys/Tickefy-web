<app-modal-shell [open]="open" title="Create New Ticket" (closed)="close()">
  <label>
    <span>Title</span>
    <input type="text" [(ngModel)]="newTitle" placeholder="Brief description of your request" />
  </label>
  <label>
    <span>Description</span>
    <textarea
      [(ngModel)]="newDescription"
      rows="6"
      placeholder="Detailed description of what you need..."
    ></textarea>
  </label>
  <label>
    <span>Deadline</span>
    <input type="date" [(ngModel)]="newDeadline" placeholder="mm/dd/yyyy" />
  </label>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <div modal-footer>
    <button class="secondary" [disabled]="createSubmitting" (click)="close()">Cancel</button>
    <button class="primary" [disabled]="createSubmitting" (click)="submit()">
      {{ createSubmitting ? 'Creating…' : 'Create Ticket' }}
    </button>
  </div>
</app-modal-shell>
