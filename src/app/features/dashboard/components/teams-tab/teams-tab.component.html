<section class="tickets">
  @if (teams$ | async; as teams) {
    @for (tm of teams; track tm.id) {
      <article class="ticket-card" (click)="onTeamClick(tm.id)">
        <div class="card-top">
          <h3>{{ tm.name }}</h3>
          <div
            class="top-right"
            style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"
          >
            <span class="pill type"
              ><lucide-icon name="users" size="14"></lucide-icon>
              {{ tm.category || 'uncategorized' }}</span
            >
          </div>
        </div>
        <div class="card-meta">
          <span class="pill"
            ><lucide-icon name="user" size="14"></lucide-icon> Team Leader:
            {{ (tm.manager?.firstName || '') + ' ' + (tm.manager?.lastName || '') }}</span
          >
        </div>
      </article>
    } @empty {
      <div class="empty-panel">
        <div class="empty-icon"><lucide-icon name="users" size="28"></lucide-icon></div>
        <div class="empty-title">No teams yet</div>
        <p class="empty-text">Create a team to see it here.</p>
      </div>
    }

    <app-pagination
      [hasPrev]="hasPrevPage"
      [hasNext]="hasNextPage"
      (previousPage)="prevPageClick()"
      (nextPage)="nextPageClick()"
    ></app-pagination>
  } @else {
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
      <app-skeleton width="100%" height="78px" borderRadius="12px"></app-skeleton>
      <app-skeleton width="100%" height="78px" borderRadius="12px"></app-skeleton>
      <app-skeleton width="100%" height="78px" borderRadius="12px"></app-skeleton>
    </div>
  }
</section>
