<app-modal-shell [open]="open" title="Create Team" (closed)="close()" [formGroup]="form">
  <label>
    <span>Name</span>
    <input type="text" formControlName="name" placeholder="Team name" />
    <app-form-error [control]="form.get('name')"></app-form-error>
  </label>

  <label>
    <span>Description</span>
    <textarea
      formControlName="description"
      rows="4"
      placeholder="What does this team do?"
    ></textarea>
    <app-form-error [control]="form.get('description')"></app-form-error>
  </label>

  <label>
    <span>Category</span>
    <select formControlName="category">
      <option [ngValue]="null">Select category</option>
      @for (c of categoryOptions; track c.value) {
        <option [ngValue]="c.value">{{ c.label }}</option>
      }
    </select>
    <app-form-error [control]="form.get('category')"></app-form-error>
  </label>

  <div modal-footer>
    <button type="button" class="secondary" [disabled]="submitting" (click)="close()">
      Cancel
    </button>
    <button type="button" class="primary" [disabled]="submitting" (click)="submit()">
      {{ submitting ? 'Creating…' : 'Create Team' }}
    </button>
  </div>
</app-modal-shell>
