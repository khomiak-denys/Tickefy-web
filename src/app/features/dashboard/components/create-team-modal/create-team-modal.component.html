@if (open) {
  <div class="modal-backdrop" (click)="close()"></div>
  <div class="modal">
    <header class="modal-head">
      <h3>Create Team</h3>
      <button class="close" (click)="close()">×</button>
    </header>
    <section class="modal-body">
      <label>
        <span>Name</span>
        <input type="text" [(ngModel)]="newTeamName" placeholder="Team name" />
      </label>
      <label>
        <span>Description</span>
        <textarea
          [(ngModel)]="newTeamDescription"
          rows="4"
          placeholder="What does this team do?"
        ></textarea>
      </label>
      <label>
        <span>Category</span>
        <select [(ngModel)]="newTeamCategory">
          <option [ngValue]="null">Select category</option>
          @for (c of categoryOptions; track c.value) {
            <option [ngValue]="c.value">{{ c.label }}</option>
          }
        </select>
      </label>
    </section>
    <footer class="modal-foot">
      <button class="secondary" [disabled]="createTeamSubmitting" (click)="close()">Cancel</button>
      <button class="primary" [disabled]="createTeamSubmitting" (click)="submit()">
        {{ createTeamSubmitting ? 'Creating…' : 'Create Team' }}
      </button>
    </footer>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
  </div>
}
